<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>承邦有限公司 - 報價單生成系統</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
}
.header {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
}
.header h1 { font-size: 2em; margin-bottom: 5px; letter-spacing: 2px; }
.header p { font-size: 0.95em; opacity: 0.85; }
.content { padding: 25px; }

.section {
    margin-bottom: 24px;
    background: #f8f9fa;
    padding: 20px;
    border-radius: 12px;
    border-left: 4px solid #667eea;
}
.section-title {
    font-size: 1.1em;
    font-weight: 700;
    color: #2a5298;
    margin-bottom: 16px;
}
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 12px;
}
.form-row.single { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; }
label { font-weight: 500; margin-bottom: 6px; color: #444; font-size: 0.9em; }
input {
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1em;
    font-family: inherit;
    transition: border-color 0.2s;
}
input:focus { outline: none; border-color: #667eea; }

.products-wrap {
    background: white;
    border: 2px dashed #667eea;
    padding: 16px;
    border-radius: 12px;
    min-height: 60px;
}
.product-item {
    background: #eef2ff;
    padding: 16px 16px 16px 16px;
    border-radius: 10px;
    margin-bottom: 12px;
    position: relative;
}
.product-item .num-badge {
    display: inline-block;
    background: #667eea;
    color: white;
    width: 24px; height: 24px;
    border-radius: 50%;
    text-align: center;
    line-height: 24px;
    font-size: 0.85em;
    font-weight: bold;
    margin-bottom: 10px;
}
.product-item .remove-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: #f56565;
    color: white;
    border: none;
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    line-height: 28px;
    text-align: center;
}
.product-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
}
.product-row.three { grid-template-columns: 1fr 1fr 1fr; }

.btn {
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.96); }
.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 4px 14px rgba(102,126,234,0.4);
}
.btn-green {
    background: #48bb78;
    color: white;
    box-shadow: 0 4px 14px rgba(72,187,120,0.3);
}
.btn-center { text-align: center; margin-top: 20px; }

.note-box {
    background: #fff4e6;
    border-left: 4px solid #f6ad55;
    padding: 14px;
    border-radius: 8px;
    margin-top: 16px;
    font-size: 0.88em;
    color: #744210;
}

/* 分享區 */
.share-section { display: none; margin-top: 24px; }
.share-msg {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 14px;
    white-space: pre-wrap;
    font-size: 0.88em;
    line-height: 1.6;
    margin: 10px 0;
}
.copy-btn {
    display: block;
    width: 100%;
    padding: 11px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
}
.copy-btn:active { background: #059669; }
.steps-box {
    background: #fef3c7;
    border-left: 4px solid #f59e0b;
    padding: 14px;
    border-radius: 8px;
    margin-top: 14px;
}
.steps-box h4 { color: #92400e; margin-bottom: 8px; }
.steps-box ol { margin-left: 18px; color: #78350f; }
.steps-box li { margin: 5px 0; line-height: 1.5; font-size: 0.9em; }
.share-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.share-btns .btn { flex: 1; min-width: 120px; font-size: 0.9em; padding: 10px 16px; }

/* 載入 overlay */
.overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}
.overlay.show { display: flex; }
.spinner {
    width: 50px; height: 50px;
    border: 5px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
    .product-row { grid-template-columns: 1fr; }
    .product-row.three { grid-template-columns: 1fr; }
    .content { padding: 16px; }
    .header { padding: 24px 16px; }
    .header h1 { font-size: 1.6em; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div></div>

<div class="container">
    <div class="header">
        <h1>承邦有限公司</h1>
        <p>CHEN BOM TRADING CO., LTD.</p>
        <p style="margin-top:6px; font-size:0.85em;">報價單自動生成系統</p>
    </div>

    <div class="content">
        <!-- 客戶資訊 -->
        <div class="section">
            <div class="section-title">客戶資訊</div>
            <div class="form-row">
                <div class="form-group"><label>客戶名稱 *</label><input type="text" id="customerName" required placeholder="例：健格科技"></div>
                <div class="form-group"><label>日期 *</label><input type="date" id="date" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>地址</label><input type="text" id="address" placeholder="例：11494台北市內湖區…"></div>
                <div class="form-group"><label>條件價格</label><input type="text" id="priceCondition" placeholder="例：未含稅"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>電話</label><input type="text" id="phone" placeholder="例：02-8791-2889 ext.3866"></div>
                <div class="form-group"><label>傳真</label><input type="text" id="fax"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>聯絡人</label><input type="text" id="contact" placeholder="例：吳柏峰／Frederick Wu"></div>
                <div class="form-group"><label>付款方式</label><input type="text" id="paymentMethod" placeholder="例：下單前確認交易條件"></div>
            </div>
            <div class="form-row single">
                <div class="form-group"><label>交貨期</label><input type="text" id="deliveryTime" placeholder="例：目前有現貨"></div>
            </div>
        </div>

        <!-- 產品項目 -->
        <div class="section">
            <div class="section-title">產品項目</div>
            <div class="products-wrap" id="productsWrap"></div>
            <div style="margin-top:12px;">
                <button class="btn btn-green" onclick="addProduct()">➕ 新增產品</button>
            </div>
        </div>

        <!-- 備註 -->
        <div class="section">
            <div class="section-title">備註說明</div>
            <div class="form-group" style="margin-bottom:10px;"><label>備註1</label><input type="text" id="note1" value="1.本報價單有效期限30天"></div>
            <div class="form-group" style="margin-bottom:10px;"><label>備註2</label><input type="text" id="note2" value="2.以上報價單未含5%營業稅"></div>
            <div class="form-group" style="margin-bottom:10px;"><label>備註3</label><input type="text" id="note3" value="3.未滿3000需負擔運費"></div>
            <div class="form-group"><label>經辦人</label><input type="text" id="handler" value="經辦人:      吳昱霖0937488958"></div>
        </div>

        <div class="note-box">⚠️ 點擊下方按鈕後將同時生成 Excel 和 PDF 兩種格式的報價單，請耐心等待。</div>

        <div class="btn-center">
            <button class="btn btn-primary" onclick="generate()">📄 生成報價單 (Excel + PDF)</button>
        </div>

        <!-- 分享區 -->
        <div class="share-section" id="shareSection">
            <div class="section">
                <div class="section-title">✅ 報價單已生成</div>
                <div style="background:#d1fae5; border-left:4px solid #10b981; padding:12px; border-radius:8px; margin-bottom:14px;">
                    <strong style="color:#065f46;">📁 文件已下載到您的裝置</strong>
                </div>
                <div style="background:#f0f9ff; border:2px dashed #3b82f6; padding:18px; border-radius:12px;">
                    <strong style="color:#1e40af;">📱 分享到 LINE 或其他 App</strong>
                    <div class="share-msg" id="shareMsg"></div>
                    <button class="copy-btn" onclick="copyMsg(this)">📋 複製訊息</button>
                    <div class="steps-box">
                        <h4>💡 分享步驟：</h4>
                        <ol>
                            <li>點擊上方「<strong>複製訊息</strong>」</li>
                            <li>開啟 <strong>LINE</strong>，進入聊天視窗</li>
                            <li>長按輸入框 → <strong>貼上</strong></li>
                            <li>點擊 <strong>「+」→ 檔案</strong></li>
                            <li>從<strong>下載資料夾</strong>選擇 PDF 並發送</li>
                        </ol>
                    </div>
                </div>
                <div class="share-btns">
                    <button class="btn btn-green" onclick="sharePDF()" style="background:#1DA1F2;">📤 系統分享</button>
                    <button class="btn btn-green" onclick="openMail()" style="background:#EA4335;">📧 開啟郵件</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 延遲載入外部庫，避免阻塞頁面 -->
<script>
(function() {
    var files = { excel: null, pdf: null, name: '', date: '' };
    var productCount = 0;

    // ---- 產品管理 ----
    function addProduct() {
        productCount++;
        var wrap = document.getElementById('productsWrap');
        var div = document.createElement('div');
        div.className = 'product-item';
        div.innerHTML =
            '<div class="num-badge">' + productCount + '</div>' +
            '<button class="remove-btn" onclick="this.parentElement.remove()">✕</button>' +
            '<div class="product-row">' +
                '<div class="form-group"><label>型號 *</label><input type="text" class="p-model" required placeholder="例：CB-201DV-E-110V"></div>' +
                '<div class="form-group"><label>品名 *</label><input type="text" class="p-name" required placeholder="例：數位電動吸錫機200W"></div>' +
            '</div>' +
            '<div class="product-row three">' +
                '<div class="form-group"><label>數量 *</label><input type="number" class="p-qty" required min="1" value="1" step="1"></div>' +
                '<div class="form-group"><label>單位 *</label><input type="text" class="p-unit" required value="台"></div>' +
                '<div class="form-group"><label>單價 *</label><input type="number" class="p-price" required min="0" step="1" placeholder="例：17800"></div>' +
            '</div>';
        wrap.appendChild(div);
    }
    window.addProduct = addProduct;

    // ---- 收集表單數據 ----
    function collectProducts() {
        var items = document.querySelectorAll('.product-item');
        var list = [];
        items.forEach(function(el, i) {
            list.push({
                no: i + 1,
                model: el.querySelector('.p-model').value,
                name: el.querySelector('.p-name').value,
                qty: parseFloat(el.querySelector('.p-qty').value) || 0,
                unit: el.querySelector('.p-unit').value,
                price: parseFloat(el.querySelector('.p-price').value) || 0
            });
        });
        return list;
    }

    function val(id) { return document.getElementById(id).value; }

    // ---- 下載辅助 ----
    function downloadBlob(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 200);
    }

    // ---- 生成 Excel ----
    function buildExcel(products) {
        return new Promise(function(resolve, reject) {
            if (typeof ExcelJS === 'undefined') { reject('ExcelJS 庫未載入'); return; }
            var wb = new ExcelJS.Workbook();
            var ws = wb.addWorksheet('Sheet1');
            ws.columns = [
                {width:8},{width:18},{width:30},{width:8},{width:8},{width:12},{width:12}
            ];
            var center = { horizontal:'center', vertical:'middle' };
            var midL = { vertical:'middle' };

            // 抬頭
            ws.mergeCells('A2:G2'); ws.getCell('A2').value='承  邦  有  限  公  司'; ws.getCell('A2').font={size:18,bold:true}; ws.getCell('A2').alignment=center;
            ws.mergeCells('A3:G3'); ws.getCell('A3').value='CHEN BOM TRADING CO., LTD.'; ws.getCell('A3').font={size:12}; ws.getCell('A3').alignment=center;
            ws.mergeCells('A4:G4'); ws.getCell('A4').value='22103 新北市汐止區221大同路三段190號8樓'; ws.getCell('A4').font={size:10}; ws.getCell('A4').alignment=center;
            ws.mergeCells('A5:G5'); ws.getCell('A5').value='Tel：02-8647-2988       Fax：02-8647-2977'; ws.getCell('A5').font={size:10}; ws.getCell('A5').alignment=center;
            ws.mergeCells('A6:G6'); ws.getCell('A6').value='E - MAIL : vectech_114@cbtrade.com.tw'; ws.getCell('A6').font={size:10}; ws.getCell('A6').alignment=center;
            ws.mergeCells('A7:G7'); ws.getCell('A7').value='www.cbtrade.com.tw'; ws.getCell('A7').font={size:10}; ws.getCell('A7').alignment=center;

            ws.mergeCells('A8:G8'); ws.getCell('A8').value='報   價   單'; ws.getCell('A8').font={size:16,bold:true}; ws.getCell('A8').alignment=center; ws.getRow(8).height=28;

            // 客戶資訊
            var lf={size:11}; 
            ws.mergeCells('A9:B9');  ws.getCell('A9').value='客  戶  名  稱   :'; ws.getCell('A9').font=lf;
            ws.getCell('C9').value=val('customerName');
            ws.mergeCells('D9:E9');  ws.getCell('D9').value='日       期 :'; ws.getCell('D9').font=lf;
            ws.mergeCells('F9:G9');  ws.getCell('F9').value=val('date');

            ws.mergeCells('A10:B10'); ws.getCell('A10').value='地             址   :'; ws.getCell('A10').font=lf;
            ws.getCell('C10').value=val('address');
            ws.mergeCells('D10:E10'); ws.getCell('D10').value='條件價格 :'; ws.getCell('D10').font=lf;
            ws.mergeCells('F10:G10'); ws.getCell('F10').value=val('priceCondition');

            ws.mergeCells('A11:B11'); ws.getCell('A11').value='電             話   :'; ws.getCell('A11').font=lf;
            ws.getCell('C11').value=val('phone');

            ws.mergeCells('A12:B12'); ws.getCell('A12').value='傳             真   :'; ws.getCell('A12').font=lf;
            ws.getCell('C12').value=val('fax');
            ws.mergeCells('D12:E12'); ws.getCell('D12').value='付款方式 :'; ws.getCell('D12').font=lf;
            ws.mergeCells('F12:G12'); ws.getCell('F12').value=val('paymentMethod');

            ws.mergeCells('A13:B13'); ws.getCell('A13').value='聯    絡     人   :'; ws.getCell('A13').font=lf;
            ws.getCell('C13').value=val('contact');
            ws.mergeCells('D13:E13'); ws.getCell('D13').value='交  貨  期 :'; ws.getCell('D13').font=lf;
            ws.mergeCells('F13:G13'); ws.getCell('F13').value=val('deliveryTime');

            // 表頭 row 15
            var headers=['項目','型號','品名','數量','單位','單價','合計'];
            var cols=['A','B','C','D','E','F','G'];
            var border={style:'thin'};
            var bAll={top:border,bottom:border,left:border,right:border};
            cols.forEach(function(c,i){
                var cell=ws.getCell(c+'15');
                cell.value=headers[i];
                cell.font={size:11,bold:true};
                cell.alignment=center;
                cell.border=bAll;
            });

            // 產品行
            products.forEach(function(p, i){
                var r=16+i;
                ws.getCell('A'+r).value=p.no;
                ws.getCell('B'+r).value=p.model;
                ws.getCell('C'+r).value=p.name;
                ws.getCell('D'+r).value=p.qty;
                ws.getCell('E'+r).value=p.unit;
                ws.getCell('F'+r).value=p.price;
                ws.getCell('G'+r).value={formula:'=D'+r+'*F'+r};
                cols.forEach(function(c){
                    ws.getCell(c+r).font={size:10};
                    ws.getCell(c+r).border=bAll;
                    ws.getCell(c+r).alignment=midL;
                });
            });

            // 合計etc
            var lastRow = 16 + products.length;
            var sumRow = lastRow + 2;
            ws.mergeCells('A'+sumRow+':B'+sumRow); ws.getCell('A'+sumRow).value='備  註 :'; ws.getCell('A'+sumRow).font={size:11,bold:true};
            ws.getCell('B'+sumRow).value=val('note1');
            ws.getCell('F'+sumRow).value='合   計'; ws.getCell('F'+sumRow).font={size:11,bold:true}; ws.getCell('F'+sumRow).alignment={horizontal:'right'};

            var gCells = products.map(function(_,i){ return 'G'+(16+i); }).join('+');
            ws.getCell('G'+sumRow).value={formula:'='+gCells};

            ws.getCell('B'+(sumRow+1)).value=val('note2');
            ws.getCell('F'+(sumRow+1)).value='稅金'; ws.getCell('F'+(sumRow+1)).alignment={horizontal:'right'};
            ws.getCell('G'+(sumRow+1)).value={formula:'=G'+sumRow+'*0.05'};

            ws.getCell('B'+(sumRow+2)).value=val('note3');
            ws.getCell('F'+(sumRow+2)).value='總額'; ws.getCell('F'+(sumRow+2)).font={size:11,bold:true}; ws.getCell('F'+(sumRow+2)).alignment={horizontal:'right'};
            ws.getCell('G'+(sumRow+2)).value={formula:'=G'+sumRow+'+G'+(sumRow+1)};

            ws.mergeCells('D'+(sumRow+5)+':G'+(sumRow+5));
            ws.getCell('D'+(sumRow+5)).value=val('handler');

            wb.xlsx.writeBuffer().then(function(buf){
                resolve(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
            }).catch(reject);
        });
    }

    // ---- 生成 PDF ----
    function buildPDF(products) {
        if (typeof window.jspdf === 'undefined') { throw new Error('jsPDF 庫未載入'); }
        var doc = new window.jspdf.jsPDF('p','mm','a4');
        doc.setFont('helvetica');
        var y = 18, cx = 105, lx = 20, rx = 120;

        doc.setFontSize(18); doc.text('Chen Bom Trading Co., Ltd.', cx, y, {align:'center'}); y+=7;
        doc.setFontSize(10); doc.text('22103 Xizhi, New Taipei City', cx, y, {align:'center'}); y+=5;
        doc.text('Tel: 02-8647-2988  Fax: 02-8647-2977', cx, y, {align:'center'}); y+=5;
        doc.text('vectech_114@cbtrade.com.tw  |  www.cbtrade.com.tw', cx, y, {align:'center'}); y+=10;

        doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.text('QUOTATION', cx, y, {align:'center'}); doc.setFont('helvetica','normal'); y+=10;

        doc.setFontSize(10);
        doc.text('Customer: ' + val('customerName'), lx, y);
        doc.text('Date: ' + val('date'), rx, y); y+=6;
        if(val('address')) { doc.text('Address: ' + val('address'), lx, y); y+=6; }
        if(val('phone'))   { doc.text('Tel: ' + val('phone'), lx, y); y+=6; }
        if(val('contact')) { doc.text('Contact: ' + val('contact'), lx, y); y+=6; }
        if(val('paymentMethod')) { doc.text('Payment: ' + val('paymentMethod'), rx, y-6); }
        if(val('deliveryTime'))  { doc.text('Delivery: ' + val('deliveryTime'), rx, y); }
        y+=8;

        // 表格
        var cw=[12,32,55,18,14,24,24]; // 欄寬
        var headers=['No.','Model','Description','Qty','Unit','Price','Total'];
        var x0=lx;

        // 表頭
        doc.setFontSize(8); doc.setFont('helvetica','bold');
        var xp=x0;
        headers.forEach(function(h,i){
            doc.rect(xp, y, cw[i], 7);
            doc.text(h, xp+cw[i]/2, y+4.5, {align:'center'});
            xp+=cw[i];
        });
        doc.setFont('helvetica','normal');
        y+=7;

        // 產品行
        products.forEach(function(p){
            xp=x0;
            var vals=[String(p.no), p.model, p.name, String(p.qty), p.unit, String(p.price), String(p.qty*p.price)];
            vals.forEach(function(v,i){
                doc.rect(xp, y, cw[i], 7);
                var align = (i===0||i===3||i===4||i===5||i===6) ? 'center' : 'left';
                var tx = align==='center' ? xp+cw[i]/2 : xp+2;
                doc.text(v, tx, y+4.5, {align:align});
                xp+=cw[i];
            });
            y+=7;
        });

        // 合計
        y+=6;
        var sub = products.reduce(function(s,p){ return s+p.qty*p.price; },0);
        var tax = sub*0.05;
        var tot = sub+tax;
        var rr = rx+30;
        doc.setFontSize(9);
        doc.text('Subtotal: NT$ '+sub.toLocaleString(), rr, y); y+=5;
        doc.text('Tax (5%): NT$ '+tax.toLocaleString(), rr, y); y+=5;
        doc.setFont('helvetica','bold');
        doc.text('Total:     NT$ '+tot.toLocaleString(), rr, y);
        doc.setFont('helvetica','normal'); y+=10;

        // 備註
        doc.setFontSize(8);
        doc.text('Notes:', lx, y); y+=5;
        [val('note1'),val('note2'),val('note3')].forEach(function(n){ if(n){doc.text(n,lx+4,y); y+=4;} });
        y+=6;
        doc.text(val('handler'), rx, y);

        return doc.output('blob');
    }

    // ---- 主生成函數 ----
    window.generate = function() {
        // 簡單驗證
        if (!val('customerName')) { alert('請填寫客戶名稱'); return; }
        var products = collectProducts();
        if (products.length === 0) { alert('請至少添加一個產品'); return; }
        var hasEmpty = products.some(function(p){ return !p.model || !p.name || !p.price; });
        if (hasEmpty) { alert('請填寫所有產品的型號、品名和單價'); return; }

        if (typeof ExcelJS === 'undefined' || typeof window.jspdf === 'undefined') {
            alert('⚠️ 必要的程式庫還沒載入完成，請等待幾秒後重新點擊，或檢查網路連線後重新整理頁面。');
            return;
        }

        var overlay = document.getElementById('overlay');
        overlay.classList.add('show');

        var cname = val('customerName');
        var dstr = val('date').replace(/-/g,'');
        files.name = cname;
        files.date = dstr;
        var baseName = dstr + '_' + cname + '_報價單';

        buildExcel(products).then(function(blob){
            files.excel = blob;
            downloadBlob(blob, baseName + '.xlsx');

            // PDF
            var pBlob = buildPDF(products);
            files.pdf = pBlob;
            downloadBlob(pBlob, baseName + '.pdf');

            // 顯示分享區
            updateShareMsg(products);
            document.getElementById('shareSection').style.display = 'block';
            overlay.classList.remove('show');
            document.getElementById('shareSection').scrollIntoView({behavior:'smooth'});
        }).catch(function(err){
            overlay.classList.remove('show');
            alert('❌ 生成失敗：' + err);
        });
    };

    // ---- 分享訊息 ----
    function updateShareMsg(products) {
        var sub = products.reduce(function(s,p){ return s+p.qty*p.price; },0);
        var tot = sub * 1.05;
        var msg =
            '【承邦有限公司 報價單】\n\n' +
            '客戶：' + val('customerName') + '\n' +
            '日期：' + val('date') + '\n\n' +
            '總金額：NT$ ' + tot.toLocaleString() + ' (含稅)\n\n' +
            '---\n' +
            '承邦有限公司\n' +
            'CHEN BOM TRADING CO., LTD.\n' +
            'Tel：02-8647-2988\n' +
            'Fax：02-8647-2977\n' +
            'vectech_114@cbtrade.com.tw\n' +
            'www.cbtrade.com.tw\n\n' +
            '※ 詳細內容請見附件 PDF/Excel 檔案';
        document.getElementById('shareMsg').textContent = msg;
    }

    window.copyMsg = function(btn) {
        var text = document.getElementById('shareMsg').textContent;
        navigator.clipboard.writeText(text).then(function(){
            btn.textContent = '✅ 已複製！';
            setTimeout(function(){ btn.textContent = '📋 複製訊息'; }, 2000);
        }).catch(function(){
            // fallback
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position='fixed'; ta.style.left='-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            btn.textContent = '✅ 已複製！';
            setTimeout(function(){ btn.textContent = '📋 複製訊息'; }, 2000);
        });
    };

    window.sharePDF = function() {
        if (!files.pdf) { alert('請先生成報價單'); return; }
        var f = new File([files.pdf], files.date+'_'+files.name+'_報價單.pdf', {type:'application/pdf'});
        if (navigator.share && navigator.canShare && navigator.canShare({files:[f]})) {
            navigator.share({ title:'報價單', text: document.getElementById('shareMsg').textContent, files:[f] });
        } else {
            alert('您的瀏覽器不支援直接分享文件。請使用「複製訊息」的方式分享。');
        }
    };

    window.openMail = function() {
        var s = encodeURIComponent('【承邦有限公司】'+val('customerName')+' - 報價單');
        var b = encodeURIComponent(document.getElementById('shareMsg').textContent);
        window.location.href = 'mailto:?subject='+s+'&body='+b;
    };

    // ---- 初始化 ----
    document.addEventListener('DOMContentLoaded', function(){
        document.getElementById('date').valueAsDate = new Date();
        addProduct();
    });

    // 延遲載入外部庫
    function loadScript(src) {
        return new Promise(function(resolve, reject){
            var s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    Promise.all([
        loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js'),
        loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')
    ]).catch(function(){
        console.warn('部分庫載入失敗，將嘗試備用來源...');
        return Promise.all([
            typeof ExcelJS !== 'undefined' ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js'),
            typeof window.jspdf !== 'undefined' ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
        ]);
    });
})();
</script>
</body>
